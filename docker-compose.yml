version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_dev
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Sql@Server2026StrongPass!
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql/data

volumes:
  sqlserverdata: